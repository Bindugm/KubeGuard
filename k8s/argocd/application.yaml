apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeguard-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yourusername/KubeGuard.git
    targetRevision: HEAD
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeguard-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
